# setting variables for APP
sentinel:

  # SET_YOUR_ELEMENT/SENTINEL_INFO_HERE
  session: 'element_sentinel'
  cookie: 'element_sentinel'
  remember:
    lifetime_seconds: 2592000   # 30 days
    path: '/'
    domain:
    secure:
    http_only: true
    same_site: 'Lax'

  adapter: 'eloquent'

  hasher: 'native'

  logger:
    driver: monolog
    channel: sentinel
    path: '%BASE_DIR%/../../logs/sentinel.log'  # kan være absolut eller relativ
    level: debug                                # emergency|alert|critical|error|warning|notice|info|debug
    bubble: true                                # valgfri
    permission: 0775                            # valgfri, hvis fil/dir skal oprettes
    date_format: "c"                            # valgfri
    format: "[%datetime%] %channel%.%level_name%: %message% %context% %extra%\n"  # valgfri

  models:
    activations:
      class: 'Element\Sentinel\Infrastructure\Eloquent\EloquentActivation'
      relations: [ ]
    persistencies:
      class: 'Element\Sentinel\Infrastructure\Eloquent\EloquentPersistence'
      relations: []
    permissions:
      class: 'Element\Sentinel\Infrastructure\Eloquent\EloquentPermission'
      relations: [ ]
    roles:
      class: 'Element\Sentinel\Infrastructure\Eloquent\EloquentRole'
      relations: [ ]
    users:
      class: 'Element\Sentinel\Infrastructure\Eloquent\EloquentUser' # 'app\models\data\User'
      relations: [ 'roles', 'sso' ]

  checkpoints:
    - 'throttle'
    - 'activation'

  activations:
    expires: 259200
    lottery:
      - 2
      - 100

  throttling:
    global:
      interval: 900
      thresholds:
        10: 1
        20: 2
        30: 4
        40: 8
        50: 16
        60: 32
    ip:
      interval: 900
      thresholds: 5
    user:
      interval: 900
      thresholds: 5